[project]
name = "git-issue-workflow"
version = "0.1.0"
description = "Typed Python surface over this skill's wt worktree front door: new/close/info with contract parsing, exit-code exceptions, and checkout classification."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
wt-py = "git_issue_workflow.wt:cli_main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/git_issue_workflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
